# PQC benchmark config (common to both boards)

# Console
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Stack analysis: enables k_thread_stack_space_get() for per-op peak stack
CONFIG_THREAD_STACK_INFO=y

# No shell (keep footprint minimal)
CONFIG_SHELL=n

# Large stack: ML-DSA-87 sign peaks around 120 KB. Run the benchmark in a
# dedicated thread with a 160 KB stack; keep the main thread small.
CONFIG_MAIN_STACK_SIZE=8192

# Optimization: -O2 for realistic performance (matches existing bare-metal
# measurements on both boards)
