tflm_cifar10:
  boards:
    frdmmcxn947@cm33_core0:
    - -armgcc@debug
    - -armgcc@release
    - -iar@debug
    - -iar@release
    - -mdk@debug
    - -mdk@release
    - +armgcc@flash_debug
    - +armgcc@flash_release
    - +iar@flash_debug
    - +iar@flash_release
    - +mdk@flash_debug
    - +mdk@flash_release
  contents:
    document:
      brief: CIFAR-10 example for TensorFlow Lite Micro
      category: eiq_examples
      example_readme:
      - examples/eiq_examples/tflm_cifar10/readme.md
      - ${board_root}/${board}/eiq_examples/tflm_cifar10/example_board_readme.md
      - ${board_root}/${board}/examples_shared_readme.md
      name: tflm_cifar10${core_id_suffix_name}
    freestanding_copied_folders:
    - middleware/eiq/
    freestanding_extra_args:
    - -DCONFIG_MCUX_PRJSEG_middleware.eiq.neutron=y
    - -DCONFIG_MCUX_COMPONENT_middleware.eiq.neutron=n
    meta_path: examples/eiq_examples/tflm_cifar10/.
    project-root-path: boards/${board}/eiq_examples/tflm_cifar10/${core_id}
  section-type: freestanding_application
